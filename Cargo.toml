[package]
name = "sudo-iroh-node"
version = "0.1.1"
description = "Node.js (napi-rs) binding for iroh endpoints and streams with Buffer-based I/O"
edition = "2024"
rust-version = "1.93"
publish = false
license = "MIT"
repository = "https://github.com/Matrixx0070/sudo-iroh-node"

[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
# Same iroh as the SUDO relay and the browser crate: the wire must match exactly.
iroh = "=1.4.1"
bytes = "1"
napi = { version = "3", default-features = false, features = ["napi8", "async"] }
napi-derive = "3"
tokio = { version = "1", features = ["sync", "io-util", "rt", "macros"] }

[build-dependencies]
napi-build = "2"

[lints.clippy]
all = "warn"

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"

# Iteration profile (`npm run build:fast`): same optimization level without the multi-minute fat LTO link.
[profile.fast]
inherits = "release"
lto = false
codegen-units = 16
