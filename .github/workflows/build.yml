# Builds the addon for every published platform and runs the binding tests in the same job wherever
# the runner can execute what it built (darwin-arm64 is tested by a job of its own). On a `v*` tag it then
# publishes the loader and the platform packages to npm. Based on the napi-rs package template
# (https://github.com/napi-rs/package-template); build and test share a job so that one platform
# without free runners cannot hold back the test results of the others.
name: build
env:
  DEBUG: napi:*
  APP_NAME: iroh-node
  MACOSX_DEPLOYMENT_TARGET: '10.13'
  RUST_TOOLCHAIN: 1.93.0
'on':
  push:
    branches:
      - main
    tags:
      - v*
  pull_request: null
  workflow_dispatch: null
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            build: npm run build -- --target x86_64-unknown-linux-gnu --use-napi-cross
            test: npm test
          - host: ubuntu-latest
            target: x86_64-unknown-linux-musl
            zig: true
            build: npm run build -- --target x86_64-unknown-linux-musl -x
            test: docker run --rm -v "$PWD:/work" -w /work node:24-alpine npm test
          # Not --use-napi-cross: its gcc cannot assemble ring's aarch64 sources ("ARM assembler must
          # define __ARM_ARCH"). zig builds them; the .2.17 suffix pins the same glibc baseline.
          - host: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            zig: true
            build: npm run build -- --target aarch64-unknown-linux-gnu.2.17 -x
            test: npm test
          - host: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            zig: true
            build: npm run build -- --target aarch64-unknown-linux-musl -x
            test: docker run --rm -v "$PWD:/work" -w /work node:24-alpine npm test
          # Both macOS targets build on the Intel image: when this was set up, jobs for the arm64 macOS
          # runners (macos-latest, macos-15, macos-26) were never assigned a runner. The arm64 binary
          # is cross-compiled here and tested by the test-darwin-arm64 job below.
          - host: macos-15-intel
            target: x86_64-apple-darwin
            build: npm run build -- --target x86_64-apple-darwin
            test: npm test
          - host: macos-15-intel
            target: aarch64-apple-darwin
            build: npm run build -- --target aarch64-apple-darwin
          - host: windows-latest
            target: x86_64-pc-windows-msvc
            build: npm run build -- --target x86_64-pc-windows-msvc
            test: npm test
    name: build ${{ matrix.settings.target }}
    runs-on: ${{ matrix.settings.host }}
    steps:
      - uses: actions/checkout@v7
      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Versions agree
        run: node scripts/check-release.cjs
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.settings.target }}
      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            ~/.napi-rs
            .cargo-cache
            target/
          key: ${{ matrix.settings.target }}-cargo-${{ matrix.settings.host }}-${{ hashFiles('Cargo.lock') }}
      - uses: mlugg/setup-zig@v2
        if: ${{ matrix.settings.zig }}
        with:
          version: 0.15.2
      - name: Install cargo-zigbuild
        uses: taiki-e/install-action@v2
        if: ${{ matrix.settings.zig }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          tool: cargo-zigbuild
      # Not `npm ci`: the platform packages in optionalDependencies do not exist on the registry
      # before the first release, and `npm ci` refuses a lock file without them.
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Build
        run: ${{ matrix.settings.build }}
        shell: bash
      # The tests need nothing from npm: the committed loader (index.js) loads the binary next to it.
      - name: Test bindings
        if: ${{ matrix.settings.test }}
        run: ${{ matrix.settings.test }}
        shell: bash
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: bindings-${{ matrix.settings.target }}
          path: ${{ env.APP_NAME }}.*.node
          if-no-files-found: error

  # Hosted Apple Silicon runners are not available to this account ("configuration macos-14-arm64 is not
  # supported"; macos-latest never acquired). The darwin-arm64 binary is still built and shipped: its build is
  # verified above and the identical codebase passes the load test on x86_64-apple-darwin. This job therefore runs
  # only on manual dispatch (workflow_dispatch) so it can be re-tried when a runner becomes available, and publish
  # treats a skipped job as "not failed" (see `outputs.result`).
  test-darwin-arm64:
    name: test aarch64-apple-darwin
    if: ${{ github.event_name == 'workflow_dispatch' }}
    needs:
      - build
    runs-on: macos-latest
    continue-on-error: true
    timeout-minutes: 30
    outputs:
      result: ${{ steps.verdict.outputs.result }}
    steps:
      - uses: actions/checkout@v7
      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: bindings-aarch64-apple-darwin
          path: .
      - name: Runner is Apple Silicon
        id: arch
        run: |
          echo "arch=$(uname -m)" >> "$GITHUB_OUTPUT"
          uname -m
      - name: Test bindings
        id: test
        if: ${{ steps.arch.outputs.arch == 'arm64' }}
        run: npm test
      - name: Verdict
        id: verdict
        if: ${{ always() }}
        run: |
          if [ "${{ steps.arch.outputs.arch }}" != "arm64" ]; then echo "result=no-arm64-runner" >> "$GITHUB_OUTPUT"
          elif [ "${{ steps.test.outcome }}" = "success" ]; then echo "result=passed" >> "$GITHUB_OUTPUT"
          else echo "result=failed" >> "$GITHUB_OUTPUT"; fi
          cat "$GITHUB_OUTPUT"

  publish:
    name: publish to npm
    # Runs on a tag once every build is green. The darwin-arm64 test may have been skipped for lack of a runner
    # (result empty or no-arm64-runner) — that is allowed; a real failure (result=failed) blocks the release.
    if: ${{ always() && startsWith(github.ref, 'refs/tags/v') && needs.build.result == 'success' && needs.test-darwin-arm64.outputs.result != 'failed' }}
    needs:
      - build
      - test-darwin-arm64
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Move artifacts into the platform packages
        run: |
          npx napi artifacts
          # `napi artifacts` also drops the binaries next to the loader, which must ship without.
          rm -f ${{ env.APP_NAME }}.*.node
          for dir in npm/*/; do cp LICENSE THIRD-PARTY-NOTICES.md "$dir"; done
          ls -R npm
      - name: Tag, loader, crate and platform packages agree
        run: node scripts/check-release.cjs "$GITHUB_REF_NAME"
      - name: Publish
        run: |
          # Platform packages first, so the loader never points at a version that is not there.
          # A version that is already on the registry is skipped, so a failed run can be re-run.
          # A prerelease (1.2.3-rc.1) goes to the dist-tag `next`, a release to `latest`.
          publish() {
            local name version tag=latest
            name=$(node -p "require('./$1/package.json').name")
            version=$(node -p "require('./$1/package.json').version")
            case "$version" in *-*) tag=next ;; esac
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version is already published"
            else
              npm publish "./$1" --provenance --access public --tag "$tag"
            fi
          }
          for dir in npm/*/; do publish "${dir%/}"; done
          publish .
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
